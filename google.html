<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        header {
            display: flex;
            justify-content: space-between;
            padding: 15px;


        }

        .left {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .right {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;

        }

        a {
            text-decoration: none;
            padding: 5px;
            color: black;
            font-size: 15px;
        }

        a:hover {
            text-decoration: underline;
        }

        .name {
            border-radius: 50%;

        }

        .menu {
            padding: 8px;
            border-radius: 50%;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .menu:hover {

            background-color: rgb(219, 215, 215);
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        footer {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid rgb(214, 207, 207);
            padding: 10px 20px;

        }

        .footleft {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .footright {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .logo {
            width: 300px;
        }

        .search-box {
            border: 1px solid rgb(219, 213, 213);
            box-shadow: rgba(14, 63, 126, 0.04) 0px 0px 0px 1px, rgba(42, 51, 69, 0.04) 0px 1px 1px -0.5px, rgba(42, 51, 70, 0.04) 0px 3px 3px -1.5px, rgba(42, 51, 70, 0.04) 0px 6px 6px -3px, rgba(14, 63, 126, 0.04) 0px 12px 12px -6px, rgba(14, 63, 126, 0.04) 0px 24px 24px -12px;
            width: fit-content;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 15px;
            border-radius: 50px;

        }

        .search-box input {
            width: 600px;
            padding: 10px;
            font-size: 16px;
            border: none;
            outline: none;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;

        }

        .ai {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px;
            border-radius: 50px;
            background: rgb(245, 237, 237);
            font-size: 14px;

        }

        .country {
            padding: 15px 30px;
            font-size: 15px;
            color: grey;
        }

        .buttons {
            display: flex;
            gap: 8px;
        }

        .buttons button {
            height: 36px;
            padding: 0 16px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            color:grey;
            background:whitesmoke;
            border:1px solid white;
            border-radius: 4px;
            cursor: pointer;
        }

        .buttons button:hover {
            border-color: rgb(230, 237, 247);
            box-shadow: 0 1px 1px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>
    <header>
        <div class="left">
            <a href="">About</a>
            <a href="">Store</a>
        </div>
        <div class="right">
            <a href="">Gmail</a>
            <a href="">Images</a>
            <img class="menu" src="https://ssl.gstatic.com/gb/images/bar/al-icon.png" alt="" class="src">
            <img class="name"
                src="https://lh3.google.com/u/0/ogw/AF2bZyjo4tdIg3M6aK61rt2xeOPaRS2Ro32hvEbrC-73apNGXQ=s32-c-mo" alt=""
                class="src">

        </div>
    </header>
    <main>
        <img class="logo" src="https://logos-world.net/wp-content/uploads/2020/09/Google-Logo.png">
        <div class="search-box">
            <i class="fa-solid fa-plus"></i>
            <input type="text">
            <i class="fa-solid fa-microphone"></i>
            <i class="fa-solid fa-camera"></i>
            <span class="ai">
                <i class="fa-solid fa-magnifying-glass"></i>
                AI Mode
            </span>
        </div>
        <div class="buttons">
            <button>Google Search</button>
            <button>I'm feeling lucky</button>
        </div>


        <p style="font-size:13px; color:grey;">
            Google offered in:
            <a href="" style="color:blue">हिन्दी</a>
            <a href="" style="color:blue">বাংলা</a>
            <a href="" style="color:blue">తెలుగు</a>
            <a href="" style="color:blue">मराठी</a>
            <a href="" style="color:blue">தமிழ்</a>
            <a href="" style="color:blue">ગુજરાતી</a>
            <a href="" style="color:blue">ಕನ್ನಡ</a>
            <a href="" style="color:blue">മലയാളം</a>
            <a href="" style="color:blue">ਪੰਜਾਬੀ</a>
        </p>
    </main>
    <div class="country">India</div>
    <footer>

        <div class="footleft">
            <a href="">Advertising</a>
            <a href="">Business</a>
            <a href="">How Search works</a>
        </div>
        <div class="footright">
            <a href="">Privacy</a>
            <a href="">Terms</a>
            <a href="">Settings</a>
        </div>
    </footer>
</body>

</html>
