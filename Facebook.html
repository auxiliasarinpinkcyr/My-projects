<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        main {

            height: 90vh;
            display: grid;
            grid-template-columns: 2fr 1fr;
        }

        footer {

            height: 10vh;
            border-top:1px solid lightgrey;
        }

        .left {

            display: grid;
            grid-template-columns: 1fr 2fr;
        }

        .right {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px;
            border-left:1px solid lightgrey;
        }
        .login{
            display:flex;
            flex-direction:column;
            gap:12px;
            width:100%;
        }
        .login input {
            padding: 16px;
            border-radius: 10px;
            border:1px solid;
            font-size:16px;
        }

        .login input:hover {
            border: 1px solid;
        }

        
        .login-btn {
            background-color: #0064e0;
            border: none;
            color: white;
            padding:14px;
            border-radius:25px;
            font-size:16px;
            cursor:pointer;
        }

        .forgot-btn {
            border: none;
            background-color: white;
            padding:14px;
            border-radius:25px;
            font-size:16px;
            cursor:pointer;
        }

        .forgot-btn:hover {
            background-color: gainsboro;
        }

        .img-tag img {
            width: 100%;
            height: 100%;
        }

        .logo img {
            width: 55px;
            margin: 30px;
        }

        .logo h1 {
            font-size: 64px;
            line-height: 50px;

            width: 200px;
            margin-top: 400px;
            margin-left: 50px;
        }

        .new-btn {
            border: 1px solid #0064E0;
            color: #0064E0;
            background-color: white;
            padding:14px;
            border-radius:25px;
            font-size:16px;
            cursor:pointer;
            margin-top:40px;
        }
        .new-btn:hover{
            background-color: gainsboro;
        }
        ul{
            display:flex;
            justify-content:center;
             gap:20px;
            list-style-type: none;
            padding: 50px;
            color:grey;
           
        }
        a{
            text-decoration:none; 
        color:grey;
           }
    </style>
</head>

<body>
    <main>
        <div class="left">
            <div class="logo">

                <div class="img-tag">
                    <img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/0/05/Facebook_Logo_%282019%29.png/1280px-Facebook_Logo_%282019%29.png?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=thumbnail"
                        alt="">

                </div>
                <h1>Explore the things you love.</h1>


            </div>
            <div class="img-tag">
                <img src="https://static.xx.fbcdn.net/rsrc.php/yb/r/HpEiFYDux5j.webp" alt="">
            </div>


        </div>


        <div class="right">
            <div class="login">
                <h4>Log in to Facebook</h4>
                <input type="text" placeholder="Email address or mobile number">
                <input type="password" placeholder="Password">
              <button class="login-btn">Log in</button>
               <button class="forgot-btn">Forgotten Password?</button>
                <button class="new-btn">Create new account</button>
            </div>

        </div>
    </main>
    <footer>
        <ul>
            <li>Emglish (UK)</li>
            <li><a href="">தமிழ்</a></li>
            <li><a href="">తెలుగు</a></li>
            <li><a href="">ಕನ್ನಡ</a></li>
            <li><a href="">اردو</a></li>
            <li><a href="">हिन्दी</a></li>
            <li><a href="">മലയാളം</a></li>
            <li><a href="">More languages…
                </a></li>

        </ul>
    </footer>
</body>

</html>
