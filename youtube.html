<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youtube</title>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
     <style>
        
        .left img{
            width:90px;
        
        }
        .left{
            display:flex;
            
            align-items: center;
            gap:20px;
            
        }
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Roboto, Arial, sans-serif;
}

header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 56px;
    padding: 0 16px;
    background: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
}



.left i {
    font-size: 20px;
    cursor: pointer;
}



.input-box {
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 0 1 640px;
}
.input-box input {
    flex: 1;
    height: 40px;
    padding: 0 16px;
    font-size: 16px;
    border: 1px solid lightgray;
    border-radius: 40px 0 0 40px;
    outline: none;
}
.input-box input:focus {
    border-color: royalblue;
}
.input-box button {
    height: 40px;
    width: 64px;
    border: 1px solid lightgray;
    border-left: none;
    border-radius: 0 40px 40px 0;
    background: whitesmoke;
    cursor: pointer;
    margin-left: -12px;
}
.input-box  i {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: whitesmoke;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}


.right {
    display: flex;
    align-items: center;
    gap: 20px;
    font-size: 15px;
}
.right i {
    font-size: 18px;
    cursor: pointer;
}
.right img.name {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
}


.left-menu {
    position: fixed;
    top: 56px;
    left: 0;
    width: 72px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    padding-top: 16px;
}
.left-menu i {
    font-size: 20px;
    cursor: pointer;
}
     </style>
</head>
<body>
    <header>
        <div class="left">
            <i class="fa-solid fa-bars"></i>
            <img src="https://thumbs.dreamstime.com/b/youtube-famous-video-sharing-service-where-you-can-watch-upload-like-comment-share-videos-logo-isolated-over-130894537.jpg" alt="" class="src">
        </div>
        <div class="input-box">
             <input type="text" placeholder="Search">
              <button><i class="fa-solid fa-magnifying-glass"></i></button>
              <i class="fa-solid fa-microphone"></i>
        </div>
        <div class="right">
             <i class="fa-solid fa-plus"></i>
             Create            
             <i class="fa-regular fa-bell"></i>
              <img class="name"
                src="https://lh3.google.com/u/0/ogw/AF2bZyjo4tdIg3M6aK61rt2xeOPaRS2Ro32hvEbrC-73apNGXQ=s32-c-mo" alt=""
                class="src">
        </div>
        <div class="left-menu">
            <i class="fa-solid fa-house"></i>
            <i class="fa-brands fa-youtube-shorts"></i>
            <i class="fa-brands fa-square-youtube"></i>
            <i class="fa-regular fa-circle-user"></i>
        </div>
        
    </header>
    
</body>
</html>
