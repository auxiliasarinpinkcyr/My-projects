<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youtube</title>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
     <style>
          * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        
        .left img{
            width:90px;
        
        }
        .left{
            display:flex;
            
            align-items: center;
            gap:20px;
            width: 250px;
            
        }
      

header {

    
    height: 10vh;
    display:flex;
    align-items:center;
    padding:0 20px;
    justify-content: space-between;
}

.right {
    display: flex;
    align-items: center;
    gap: 20px;
    font-size: 15px;
    justify-content: flex-end;
width: 250px;
}
.right i {
    font-size: 18px;
    cursor: pointer;
}
.right img.name {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background-color: lightgray;
    cursor: pointer;
}

.input-box {
    display: flex;
    align-items: center;
}

.input-box input {
    width: 500px;
    height: 40px;
    padding-left: 15px;
    font-size: 16px;
    border: 1px solid lightgray;
    border-radius: 20px 0 0 20px;
    outline: none;
}

.search-btn {
    height: 40px;
    width: 60px;
    border: 1px solid lightgray;
    border-left: none;
    border-radius: 0 20px 20px 0;
    background-color: whitesmoke;
    cursor: pointer;
}

.mic {
    height: 40px;
    width: 40px;
    margin-left: 10px;
    border: none;
    border-radius: 50%;
    background-color: whitesmoke;
    cursor: pointer;
}
.create {
    padding: 8px 15px;
    border-radius: 20px;
    background-color: whitesmoke;
    font-size: 14px;
    cursor: pointer;
}

     </style>
</head>
<body>
    <header>
        <div class="left">
            <i class="fa-solid fa-bars"></i>
            <img src="https://thumbs.dreamstime.com/b/youtube-famous-video-sharing-service-where-you-can-watch-upload-like-comment-share-videos-logo-isolated-over-130894537.jpg" alt="" class="src">
        </div>
        <div class="input-box">
             <input type="text" placeholder="Search">
              <button class="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
              <button class="mic"><i class="fa-solid fa-microphone"></i></button>
        </div>
        <div class="right">
             <div class="create">
    <i class="fa-solid fa-plus"></i> Create
</div>
             <i class="fa-regular fa-bell"></i>
              <img class="name"
              src="https://lh3.google.com/u/0/ogw/AF2bZyjo4tdIg3M6aK61rt2xeOPaRS2Ro32hvEbrC-73apNGXQ=s32-c-mo" alt=""
                class="src">
        </div>
       
        
    </header>
    
</body>
</html>
